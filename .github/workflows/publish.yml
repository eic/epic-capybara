name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  id-token: write

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install --upgrade build

      - name: Verify package version matches release tag
        run: |
          PACKAGE_VERSION="$(python -c 'import epic_capybara.__about__ as a; print(a.__version__)')"
          TAG="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG#v}"
          echo "Package version: ${PACKAGE_VERSION}"
          echo "Release tag:     ${TAG} (version ${TAG_VERSION})"
          if [ "${PACKAGE_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Package version '${PACKAGE_VERSION}' does not match release tag '${TAG}'"
            exit 1
          fi

      - name: Build package
        run: python -m build

      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/epic-capybara
    permissions:
      id-token: write
    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
